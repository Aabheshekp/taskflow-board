<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taskflow Board</title><link rel="stylesheet" href="/style.css"></head><body><main><header><div><p class="eyebrow">YOUR WORKSPACE</p><h1>Taskflow</h1><p>Move good work forward, one clear next step at a time.</p></div><button id="new-task">＋ New task</button></header><section id="form-card" class="form-card hidden"><form id="task-form"><input name="title" placeholder="Task title" required maxlength="120"><textarea name="description" placeholder="A little context (optional)" maxlength="1000"></textarea><div><select name="priority"><option value="normal">Normal priority</option><option value="high">High priority</option><option value="low">Low priority</option></select><input name="due_date" type="date"><button>Add task</button></div><p id="error" role="alert"></p></form></section><div id="board" class="board"><section class="lane" data-status="todo"><h2>To do <span></span></h2><div class="cards"></div></section><section class="lane" data-status="doing"><h2>In progress <span></span></h2><div class="cards"></div></section><section class="lane" data-status="done"><h2>Done <span></span></h2><div class="cards"></div></section></div><footer><span>Taskflow Board</span><span>Stored locally in SQLite</span></footer></main><script src="/app.js"></script></body></html>
